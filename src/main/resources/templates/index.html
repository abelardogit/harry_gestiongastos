<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/cabecero::cabecero-seccion(titulo='Sistema de Gestion de Gastos')}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<body>



<div th:replace="~{fragmentos/navegacion::navegacion-seccion}"/>

<div class="container">
    <div class="container text-center" style="margin:30px">
        <h2> Sistema de Gestion de Finanzas</h2>
    </div>
</div>

<div class="container">
    <table class="table table-striped table-hover align-middle table-bordered">
        <thead class="table-dark text-center">
        <tr >
            <th  scope="col">Id</th>
            <th  scope="col">Monto</th>
            <th scope="col">Tipo de Movimiento</th>
            <th scope="col">Fecha de Movimiento</th>
            <th scope="col">Descripcion</th>
            <th scope="col">Categoria</th>
            <th scope="col"></th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="movimiento: ${movimientos}">
            <th th:text="${movimiento.idMovimiento}" scope="row"></th>
            <td th:text="${movimiento.monto}"></td>
            <td th:text="${movimiento.movimientoTipo}"> </td>
            <td th:text="${movimiento.fechaMovimiento}" > </td>
            <td th:text="${movimiento.descripcion}" > </td>
            <td th:text="${movimiento.categoria}" > </td>
            <td class="text-center" >
                <div class="container">
                    <a th:href="@{/editar/{id}(id=${movimiento.idMovimiento})}" class="btn btn-warning btn-sm me-3">
                        <i class="fa-solid fa-pen-to-square"></i>
                        Editar
                    </a>
                    <a th:href="@{/eliminar/{id}(id=${movimiento.idMovimiento})}" class="btn btn-danger btn-sm me-3">
                        <i role="img" class="fa-solid fa-trash" onclick="confirmarEliminar()"></i>
                        Eliminar</a>
                </div>
            </td>

        </tr>

        </tbody>
    </table>

</div>

<div th:replace="~{fragmentos/pie-pagina::pie-pagina-seccion}"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js" integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
